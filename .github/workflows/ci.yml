name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest

      - name: Generated model data stay in sync
        run: |
          uv run msqaly-export-params
          uv run python -m msqaly.exportversions
          uv run python -m msqaly.geo
          uv run python -m msqaly.diagnostics --write > /dev/null
          git diff --exit-code -- web/params.json web/allocation_v10.json \
            web/allocation_v11.json web/allocation_v12.json web/geo.json \
            web/matching_diagnostics.json results/gift_ledger.csv \
            || (echo "::error::Generated model data are stale; rerun the README reproduction commands" && exit 1)

      - name: Model runs end-to-end
        run: uv run msqaly --n 5000
